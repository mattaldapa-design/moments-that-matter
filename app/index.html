<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Moments That Matter</title>
  <meta name="description" content="A travel journal built from quick blocks, one day at a time.">
  <meta name="theme-color" content="#15100e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Moments">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Unbounded:wght@600;800&family=Figtree:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/darkroom-tokens.css">
  <link rel="stylesheet" href="css/darkroom.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="dr-grain">
  <header class="mtm-top" id="top"></header>
  <main class="dr-page mtm-page" id="app" aria-live="polite"></main>
  <div id="toast" class="mtm-toast" hidden></div>
  <script type="module" src="js/app.js"></script>
  <script>
    // Register the offline worker; when a newer one takes over, reopen once so the new files are in use.
    if ('serviceWorker' in navigator) {
      let hadWorker = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadWorker) location.reload(); hadWorker = true; });
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
